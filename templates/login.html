{% extends "base.html" %}
{% block title %}Log in — Krypto{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="card kr-auth-card">
    <div class="card-body">
      <div class="text-center mb-4">
        <span class="kr-auth-logo"><i class="bi bi-shield-lock-fill me-1"></i>Krypto</span>
      </div>
      <p class="text-muted small">
        Your password both authenticates you and unlocks your PKCS#12 keystore,
        making your private key available for this session only.
      </p>
      <form method="post">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Log in &amp; unlock keystore</button>
      </form>
      <p class="small text-muted text-center mt-4 mb-0">No account?
        <a href="{{ url_for('register', next=request.args.get('next')) }}">Register</a></p>
    </div>
  </div>
</div>
{% endblock %}
